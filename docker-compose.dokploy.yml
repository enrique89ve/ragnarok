services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args: *norse-build-vars
    restart: unless-stopped
    environment: *norse-runtime-vars
    expose:
      - "5000"
    networks:
      - dokploy-network
    volumes:
      - ragnarok-data:/app/data

volumes:
  ragnarok-data:

networks:
  dokploy-network:
    external: true
