services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_NETWORK_STAGE: ${VITE_NETWORK_STAGE:-testnet}
        VITE_RAGNAROK_PROTOCOL_ID: ${VITE_RAGNAROK_PROTOCOL_ID:-rk_game_testnet}
        VITE_RAGNAROK_COLLECTION_ID: ${VITE_RAGNAROK_COLLECTION_ID:-ragnarok-testnet}
        VITE_RAGNAROK_RESET_EPOCH: ${VITE_RAGNAROK_RESET_EPOCH:?Set VITE_RAGNAROK_RESET_EPOCH in Dokploy}
        VITE_RAGNAROK_ADMIN_ACCOUNT: ${VITE_RAGNAROK_ADMIN_ACCOUNT:-ragnarok-test}
        VITE_RAGNAROK_ADMIN_OPERATOR_ACCOUNT: ${VITE_RAGNAROK_ADMIN_OPERATOR_ACCOUNT:-ragnarok-test-operator}
        VITE_RAGNAROK_GENESIS_ACCOUNT: ${VITE_RAGNAROK_GENESIS_ACCOUNT:-ragnarok-test}
        VITE_RAGNAROK_TREASURY_ACCOUNT: ${VITE_RAGNAROK_TREASURY_ACCOUNT:-ragp2p}
        VITE_RAGNAROK_INDEX_ACCOUNT: ${VITE_RAGNAROK_INDEX_ACCOUNT:-ragp2p}
        VITE_RAGNAROK_INDEXER_URL: ${VITE_RAGNAROK_INDEXER_URL:-}
        VITE_RAGNAROK_ART_INDEXER_URL: ${VITE_RAGNAROK_ART_INDEXER_URL:-}
        VITE_NFTLOX_PROTOCOL_ID: ${VITE_NFTLOX_PROTOCOL_ID:-nftlox_testnet}
        VITE_NFT_ART_BASE_URL: ${VITE_NFT_ART_BASE_URL:-}
        VITE_EXTERNAL_URL_BASE: ${VITE_EXTERNAL_URL_BASE:-}
        VITE_SEASON_START: ${VITE_SEASON_START:-}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: 5000
      RAGNAROK_RUNTIME_MODE: ${RAGNAROK_RUNTIME_MODE:-alfa-testnet}
      VITE_NETWORK_STAGE: ${VITE_NETWORK_STAGE:-testnet}
      VITE_RAGNAROK_PROTOCOL_ID: ${VITE_RAGNAROK_PROTOCOL_ID:-rk_game_testnet}
      VITE_RAGNAROK_COLLECTION_ID: ${VITE_RAGNAROK_COLLECTION_ID:-ragnarok-testnet}
      VITE_RAGNAROK_RESET_EPOCH: ${VITE_RAGNAROK_RESET_EPOCH:?Set VITE_RAGNAROK_RESET_EPOCH in Dokploy}
      VITE_RAGNAROK_ADMIN_ACCOUNT: ${VITE_RAGNAROK_ADMIN_ACCOUNT:-ragnarok-test}
      VITE_RAGNAROK_ADMIN_OPERATOR_ACCOUNT: ${VITE_RAGNAROK_ADMIN_OPERATOR_ACCOUNT:-ragnarok-test-operator}
      VITE_RAGNAROK_GENESIS_ACCOUNT: ${VITE_RAGNAROK_GENESIS_ACCOUNT:-ragnarok-test}
      VITE_RAGNAROK_TREASURY_ACCOUNT: ${VITE_RAGNAROK_TREASURY_ACCOUNT:-ragp2p}
      VITE_RAGNAROK_INDEX_ACCOUNT: ${VITE_RAGNAROK_INDEX_ACCOUNT:-ragp2p}
      VITE_RAGNAROK_INDEXER_URL: ${VITE_RAGNAROK_INDEXER_URL:-}
      VITE_RAGNAROK_ART_INDEXER_URL: ${VITE_RAGNAROK_ART_INDEXER_URL:-}
      VITE_NFTLOX_PROTOCOL_ID: ${VITE_NFTLOX_PROTOCOL_ID:-nftlox_testnet}
      VITE_NFT_ART_BASE_URL: ${VITE_NFT_ART_BASE_URL:-}
      VITE_EXTERNAL_URL_BASE: ${VITE_EXTERNAL_URL_BASE:-}
      VITE_SEASON_START: ${VITE_SEASON_START:-}
      RAGNAROK_PROTOCOL_ID: ${VITE_RAGNAROK_PROTOCOL_ID:-rk_game_testnet}
      RAGNAROK_RESET_EPOCH: ${VITE_RAGNAROK_RESET_EPOCH:?Set VITE_RAGNAROK_RESET_EPOCH in Dokploy}
      RAGNAROK_ADMIN_OPERATOR_ACCOUNT: ${VITE_RAGNAROK_ADMIN_OPERATOR_ACCOUNT:-ragnarok-test-operator}
      RAGNAROK_CHAIN_STATE_FILE: ${RAGNAROK_CHAIN_STATE_FILE:-data/chain-state.alfa-testnet.json}
      RAGNAROK_NFT_OWNERSHIP_SOURCE: ${RAGNAROK_NFT_OWNERSHIP_SOURCE:-json}
      RAGNAROK_INDEX_START_BLOCK: ${RAGNAROK_INDEX_START_BLOCK:-106536940}
      ENABLE_CHAIN_INDEXER: ${ENABLE_CHAIN_INDEXER:-true}
      ENABLE_INDEX_CHECKPOINT_PUBLISHER: ${ENABLE_INDEX_CHECKPOINT_PUBLISHER:-false}
      RAGNAROK_INDEX_CHECKPOINT_DRY_RUN: ${RAGNAROK_INDEX_CHECKPOINT_DRY_RUN:-true}
      RAGNAROK_INDEX_ACCOUNT: ${VITE_RAGNAROK_INDEX_ACCOUNT:-ragp2p}
    expose:
      - "5000"
    networks:
      - dokploy-network
    volumes:
      - ragnarok-data:/app/data

volumes:
  ragnarok-data:

networks:
  dokploy-network:
    external: true
